<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxy Admin | System Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" style="max-width: 900px; display: flex; gap: 20px; flex-wrap: wrap;">
        
        <!-- Login Panel -->
        <div class="main-panel" id="loginPanel" style="width: 100%; max-width: 400px; margin: 0 auto;">
            <div class="header">
                <h1 style="color: #ef4444;">ROOT ACCESS</h1>
                <p>Authentication Required</p>
            </div>
            <div class="input-box">
                <input type="password" id="adminPass" placeholder="[!] Enter Admin Password">
            </div>
            <button onclick="attemptLogin()" style="background: #ef4444; color: #fff;">AUTHENTICATE</button>
        </div>

        <!-- System Stats Panel -->
        <div class="main-panel" id="adminPanel" style="display: none; flex: 1; min-width: 350px;">
            <div class="header">
                <h1 style="color: #4ade80;">Telemetry Monitor</h1>
                <p>Real-Time Safe Dashboard</p>
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <div style="flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center;">
                    <span style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Active Tasks</span>
                    <h2 id="activeTasks" style="color: var(--text-main); margin-top: 5px;">0</h2>
                </div>
                <div style="flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center;">
                    <span style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Total Completed</span>
                    <h2 id="completedTasks" style="color: #4ade80; margin-top: 5px;">0</h2>
                </div>
            </div>

            <div class="live-terminal" id="adminTerminal" style="height: 250px;">
                <div id="adminLogContent">root@roxy-scraper:~# Awaiting server events...</div>
            </div>
        </div>

        <!-- UI Customizer Panel -->
        <div class="main-panel" id="uiPanel" style="display: none; flex: 1; min-width: 350px;">
            <div class="header">
                <h1 style="color: var(--primary);">UI Customizer</h1>
                <p>Live Public Website Styling</p>
            </div>
            
            <div class="input-box">
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 5px; text-transform: uppercase;">Main Title Text</label>
                <input type="text" id="uiTitle">
            </div>
            <div class="input-box">
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 5px; text-transform: uppercase;">Description Text</label>
                <input type="text" id="uiDesc">
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 5px; text-transform: uppercase;">Background 1</label>
                    <input type="color" id="bg1Color" style="width: 100%; height: 40px; border: none; background: transparent; cursor: pointer;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 5px; text-transform: uppercase;">Background 2</label>
                    <input type="color" id="bg2Color" style="width: 100%; height: 40px; border: none; background: transparent; cursor: pointer;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 5px; text-transform: uppercase;">Primary Color</label>
                    <input type="color" id="primaryColor" style="width: 100%; height: 40px; border: none; background: transparent; cursor: pointer;">
                </div>
            </div>
            
            <button onclick="updateTheme()" style="background: var(--text-main); color: #000;">PUSH LIVE THEME</button>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        function attemptLogin() {
            const pass = document.getElementById('adminPass').value;
            socket.emit('admin_login', pass);
        }

        socket.on('admin_auth', (data) => {
            if(data.success) {
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('uiPanel').style.display = 'block';
            } else { alert('Access Denied: Invalid Admin Password!'); }
        });

        socket.on('admin_stats', (stats) => {
            document.getElementById('activeTasks').innerText = stats.activeSessionsCount;
            document.getElementById('completedTasks').innerText = stats.totalCompletedClones;
        });

        socket.on('admin_log', (msg) => {
            const div = document.createElement('div');
            div.innerText = `root@roxy-scraper:~# ${msg}`;
            div.style.marginBottom = '4px';
            document.getElementById('adminLogContent').appendChild(div);
            const terminal = document.getElementById('adminTerminal');
            terminal.scrollTop = terminal.scrollHeight;
        });

        // Load current theme data to inputs
        socket.on('current_theme_data', (theme) => {
            document.getElementById('bg1Color').value = theme.bg1;
            document.getElementById('bg2Color').value = theme.bg2;
            document.getElementById('primaryColor').value = theme.primary;
            document.getElementById('uiTitle').value = theme.title;
            document.getElementById('uiDesc').value = theme.desc;
        });

        function updateTheme() {
            const newTheme = {
                bg1: document.getElementById('bg1Color').value,
                bg2: document.getElementById('bg2Color').value,
                primary: document.getElementById('primaryColor').value,
                title: document.getElementById('uiTitle').value,
                desc: document.getElementById('uiDesc').value
            };
            socket.emit('update_theme_config', newTheme);
            alert('Theme config successfully pushed to all clients!');
        }
    </script>
</body>
</html>
