<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe System Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #0f172a;">
    <div class="app-container" style="max-width: 800px; justify-content: center;">
        <div class="main-panel liquid-glass" id="loginPanel">
            <div class="header">
                <h1 style="color: #6366f1;">System Dashboard</h1>
                <p>Admin Password Required</p>
            </div>
            <div class="input-box">
                <input type="password" id="adminPass" placeholder="Enter Password">
            </div>
            <button onclick="attemptLogin()" style="background: #6366f1;">Login</button>
        </div>

        <div class="main-panel liquid-glass" id="adminPanel" style="display: none;">
            <div class="header">
                <h1 style="color: #34c759;">Server Telemetry Monitor</h1>
                <p>Real-Time Safe Dashboard</p>
            </div>
            
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <div style="flex: 1; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; text-align: center;">
                    <span style="font-size: 12px; opacity: 0.8;">Active Tasks</span>
                    <h2 id="activeTasks" style="color: #38bdf8;">0</h2>
                </div>
                <div style="flex: 1; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; text-align: center;">
                    <span style="font-size: 12px; opacity: 0.8;">Total Completed</span>
                    <h2 id="completedTasks" style="color: #34c759;">0</h2>
                </div>
            </div>

            <div class="live-terminal" id="adminTerminal" style="height: 300px; color: #38bdf8; font-size: 13px;">
                <div id="adminLogContent">Awaiting server events...</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const loginPanel = document.getElementById('loginPanel');
        const adminPanel = document.getElementById('adminPanel');
        const adminLogContent = document.getElementById('adminLogContent');
        const adminTerminal = document.getElementById('adminTerminal');

        function attemptLogin() {
            const pass = document.getElementById('adminPass').value;
            socket.emit('admin_login', pass);
        }

        socket.on('admin_auth', (data) => {
            if(data.success) {
                loginPanel.style.display = 'none';
                adminPanel.style.display = 'block';
            } else {
                alert('Invalid Admin Password!');
            }
        });

        socket.on('admin_stats', (stats) => {
            document.getElementById('activeTasks').innerText = stats.activeSessionsCount;
            document.getElementById('completedTasks').innerText = stats.totalCompletedClones;
        });

        socket.on('admin_log', (msg) => {
            const div = document.createElement('div');
            div.innerText = msg;
            div.style.marginBottom = '6px';
            adminLogContent.appendChild(div);
            adminTerminal.scrollTop = adminTerminal.scrollHeight;
        });
    </script>
</body>
</html>
