<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxy Scraper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="main-panel">
            <div class="header">
                <h1 id="appTitle">Roxy Scraper</h1>
                <p id="appDesc">Advanced Discord Server Cloner</p>
            </div>

            <form id="clonerForm">
                <div class="input-box">
                    <input type="password" id="userToken" placeholder="[!] Enter Discord Token" required>
                </div>
                
                <div class="input-box">
                    <input type="text" id="sourceId" placeholder="Source Server ID" required>
                </div>
                <div class="input-box">
                    <input type="text" id="targetId" placeholder="Target Server ID" required>
                </div>

                <div class="toggles-container">
                    <div class="toggle-row">
                        <span>Mirror Roles & Overwrites</span>
                        <label class="switch"><input type="checkbox" id="cloneRoles" checked><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <span>Mirror Channels & Layout</span>
                        <label class="switch"><input type="checkbox" id="cloneChannels" checked><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <span>Scrape Chat History</span>
                        <label class="switch"><input type="checkbox" id="cloneMessages" checked><span class="slider"></span></label>
                    </div>
                    <div class="limit-box">
                        <label>Message Fetch Limit (Max 100)</label>
                        <input type="number" id="msgLimit" value="15" min="1" max="100">
                    </div>
                </div>

                <button type="submit" id="startBtn">START SCRAPE SEQUENCE</button>
            </form>

            <div class="progress-wrapper">
                <div class="progress-text">
                    <span>Operation Status</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="live-terminal" id="terminal">
                <div id="logContent">root@roxy-scraper:~# Waiting for input...</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
