<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid iOS Cloner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="main-panel liquid-glass">
            <div class="header">
                <h1>Cloner Pro</h1>
                <p>iOS 26 Liquid Engine</p>
            </div>

            <form id="clonerForm">
                <div class="input-box">
                    <input type="password" id="userToken" placeholder="Discord Auth Token" required>
                </div>
                <div class="row">
                    <div class="input-box">
                        <input type="text" id="sourceId" placeholder="Source Server ID" required>
                    </div>
                    <div class="input-box">
                        <input type="text" id="targetId" placeholder="Target Server ID" required>
                    </div>
                </div>

                <div class="toggles-container">
                    <div class="toggle-row">
                        <span>Clone Roles & Perms</span>
                        <label class="switch"><input type="checkbox" id="cloneRoles" checked><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <span>Clone Channels & Categories</span>
                        <label class="switch"><input type="checkbox" id="cloneChannels" checked><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <span>Clone Chat Messages</span>
                        <label class="switch"><input type="checkbox" id="cloneMessages" checked><span class="slider"></span></label>
                    </div>
                    <div class="limit-box">
                        <label>Messages per channel (Max 100)</label>
                        <input type="number" id="msgLimit" value="15" min="1" max="100">
                    </div>
                </div>

                <button type="submit" id="startBtn">Initiate Sync</button>
            </form>

            <div class="progress-wrapper">
                <div class="progress-text" id="progressText">0% Complete</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="live-terminal" id="terminal">
                <div id="logContent">Waiting for system initialization...</div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
